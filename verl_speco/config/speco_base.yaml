# Shared SPECO configuration without Hydra primary-config metadata.
#
# Keep online rollout/training defaults here so both the PPO trainer and the
# standalone draft trainer inherit the same drafter model contract.

speco:
  enable: true

  checkpoint:
    # Shift periodic actor/drafter saves away from online publish steps.
    # With save_freq=10 and offset=1, saves run at 11, 21, 31, ... .
    save_offset: 0

  verl_base:
    version: "0.8.0"
    branch: release/v0.8.0
    source_modifications_allowed: false

  compatibility:
    policy: warn
    strict_env: VERL_SPECO_STRICT_VERL
    require_verl_base_branch: release/v0.8.0
    require_verl_base_version: 0.8.0

  trainer:
    task_runner: verl_speco.integration.task_runner.SpecoTaskRunner
    ray_trainer: verl_speco.trainer.speco_ray_trainer.SpecoRayPPOTrainer

actor_rollout_ref:
  rollout:
    drafter:
      enable: false
      enable_drafter_training: false
      speculative_algorithm: EAGLE3
      model_path: /path/to/drafter/model
      # Stable metadata source retained when model_path switches to a checkpoint.
      runtime_config_source_model_path: null
      checkpoint_path: null
      # Explicit recovery override for rolling the drafter back independently
      # while the actor resumes from its latest committed checkpoint.
      resume_model_path: null
      world_size: 16

      rollout:
        spec_steps: 3
        spec_topk: 1
        spec_verify_tokens: 3
        cuda_graph_max_bs: null

      vllm:
        draft_tensor_parallel_size: null
        max_model_len: null
        enforce_eager: null
        # DSpark serving modes. full preserves the checkpoint behavior; swa is
        # uniform non-causal context SWA. Mixed hybrid/sparse modes fail closed
        # until the vLLM DFlash cache supports mixed per-layer attention.
        dspark_attention_mode: full
        # Counts actor-context tokens only. For DSpark SWA, SPECO automatically
        # adds the draft block size to vLLM-Ascend's runtime adapter window.
        dspark_context_window: null
        dspark_runtime_overlay_root: null
        speculative_config_overrides: {}
        # RL rollout assumes exact target-distribution verification. Set this
        # only when intentionally opting into a lossy acceptance method.
        allow_lossy_speculative_sampling: false

      training:
        mode: online
        # Limit online drafter workers without changing the actor/rollout pool.
        # Must be divisible by rollout TP * DP * PP. Null uses the full pool.
        worker_world_size: null
        collect_hidden_states_from_sgl: false
        collect_hidden_states_from_old_logprob: false
        # SGLang does not apply the target final norm to captured aux states.
        # Keep this false unless training and serving consistently use pre-norm.
        allow_sglang_prenorm_last_layer: false
        old_logprob_hidden_capture_impl: forward_hook
        use_data_buffer: false
        collect_interval_steps: 5
        collection_sample_rate: 1.0
        max_collect_samples_per_step_per_replica: 16
        max_collect_tokens_per_step_per_replica: 16384
        # Deterministically sample windows from the front/middle/tail thirds.
        hidden_state_window_mode: stratified
        hidden_state_window_strata_weights: [0.34, 0.33, 0.33]
        hidden_state_window_tokens_per_sample: 512
        hidden_state_window_min_rows: 512
        hidden_state_random_max_offset: null
        hidden_state_random_seed_by_step: true
        hidden_state_max_tokens_per_sample: null
        # Skip a drafter update when trace or hidden-state transport silently loses
        # samples. Set collection_integrity_fail_action=raise for strict debugging.
        spec_trace_min_sample_coverage: 0.95
        spec_trace_min_teacher_logprob_coverage: 0.95
        oldlogprob_min_materialization_ratio: 0.95
        oldlogprob_min_consumption_ratio: 0.95
        collection_integrity_fail_action: skip
        # Maximum allowed absolute mean-acceptance drop. Transactional candidate
        # mode rolls back and regenerates; legacy direct publish aborts the run.
        post_update_mean_acceptance_length_drop_abort_threshold: 0.5
        # Transactional candidate publication. Online experiment launchers may
        # enable this; the repository-wide default preserves legacy behavior.
        candidate_gate_enabled: false
        candidate_gate_alphas: [0.0, 0.25, 0.5, 1.0]
        candidate_gate_samples: 16
        candidate_gate_max_tokens: 256
        candidate_gate_min_acceptance_delta: 0.0
        candidate_gate_max_ms_per_token_regression: 0.15
        candidate_max_fixed_loss_delta: 0.0
        candidate_max_grad_norm: 50.0
        candidate_grad_norm_rolling_multiplier: 5.0
        candidate_max_rejected_k3_clamp_ratio: 0.5
        candidate_max_rejected_k3_median: 9.5
        save_best_drafter_checkpoint: true
        best_checkpoint_min_acceptance_delta: 0.0
        # Retain separate acceptance/TPS best checkpoints using the first full
        # rollout after each synchronous publish. This adds no evaluation rollout.
        dual_metric_best_checkpoint_enabled: false
        best_checkpoint_min_throughput_relative_delta: 0.0
        # Dual bests are inference/evaluation artifacts; periodic and final
        # checkpoints still include optimizer state for resume.
        dual_metric_best_checkpoint_include_optimizer: false
        fixed_eval_seed: 17
        fixed_eval_sample_rate: 0.1
        # Persistent per-replica cohort used for drafter pre/post update evaluation.
        fixed_eval_samples_per_replica: 0
        # Optional immutable rollout cohorts for later drafter comparisons.
        # Export before actor update; retain actor checkpoints at step-1.
        fixed_eval_export_steps: []
        fixed_eval_export_samples: 128
        fixed_eval_export_seed: 17
        fixed_eval_export_dir: null
        max_seq_len: 8192
        step: 10
        batch_size_per_gpu: 4
        training_interval_steps: 5
        publish_interval_steps: 0
        publish_async: false
        publish_dtype: null
        publish_param_name_patterns: null
        draft_update_use_shm: null
        draft_update_weights_bucket_megabytes: null
        draft_update_pause_generation: true
        draft_update_flush_before: true
        draft_update_flush_after: true
        skip_heavy_cleanup_after_drafter_training: false
        save_full_drafter_checkpoint: true
        sample_last_n_steps: 20
        train_batches_per_cycle: 4
        # Prefer samples not yet consumed in the current collection cycle.
        train_unique_samples_first: false
        lr: 1e-5
        # Optional bounded certainty LR with same-actor paired candidate validation.
        entropy_lr_enabled: false
        entropy_lr_min: 5e-6
        entropy_lr_max: 1.5e-5
        entropy_lr_ema_beta: 0.3
        lr_warmup_steps: 0
        lr_scheduler_type: constant
        lr_decay_steps: 100
        min_lr_ratio: 0.1
        warmup_style: null
        resume_trainer_state_from_checkpoint: true
        use_logits: false
        target_lm_head_row_restricted_sync: true
        logits_topk: 128
        logits_sparse_min_intersection: 1
        logits_sparse_min_mass: null
        logits_coverage_mask_min_ratio: 0.1
        logits_coverage_mask_require_top1: false
        ttt_length: 1
        vocab_mapping_path: null
        dflash_block_size: 16
        dflash_num_anchors: 512
        dflash_loss_decay_gamma: 7.0
        dflash_front_position_weight: 1.0
        dflash_front_position_count: 0
        dflash_hard_sample_ratio: 0.0
        dflash_hidden_size: null
        dflash_num_target_layers: 5
        dflash_num_hidden_layers: 1
        dflash_mask_token_id: null
        dflash_target_layer_ids: null
        dflash_max_window: 512
        # chunked_ce is exact full-vocab CE with token-wise activation checkpointing.
        dflash_loss_mode: full_vocab
        dflash_sampled_ce_negatives: 0
        dflash_ce_token_chunk_size: 64
        dspark_block_size: 7
        dspark_num_anchors: 32
        # Reserve part of the existing anchor budget for reached first rejections
        # with low actor entropy. Zero preserves deterministic uniform sampling.
        dspark_low_entropy_anchor_fraction: 0.0
        dspark_low_entropy_threshold: 0.01
        dspark_position_entropy_stratified_sampling_enabled: false
        dspark_low_entropy_max_rejected_logprob: -4.0
        # Zero disables the stage gate; otherwise require consecutive collection
        # cycles above the reached-token low-entropy share before prioritizing.
        dspark_certainty_share_threshold: 0.0
        dspark_certainty_patience: 2
        # Draft-OPD response tokens are not position-decayed; rejected suffixes
        # use their own decay below.
        dspark_loss_decay_gamma: 0.0
        dspark_hard_sample_ratio: 0.0
        dspark_hidden_size: null
        dspark_num_target_layers: 5
        dspark_num_hidden_layers: 5
        dspark_mask_token_id: null
        dspark_target_layer_ids: null
        dspark_max_window: 512
        # Optional attention-context experiments. full is the existing baseline.
        # swa crops only actor context; hybrid restores the final N layers to full;
        # sparse_global restores selected prefix/prompt/actor pages in those layers.
        dspark_attention_mode: full
        dspark_context_window: null
        dspark_global_layer_count: 1
        # Keep disabled for exact legacy behavior. Enable for cropped/nonzero-offset
        # windows so context and draft RoPE use their original sequence positions.
        dspark_use_absolute_position_ids: false
        dspark_global_prefix_tokens: 0
        dspark_global_prompt_tokens: 0
        dspark_actor_guided_page_size: 16
        dspark_actor_guided_page_budget_tokens: 0
        dspark_actor_guided_page_starts_field: actor_selected_context_page_starts
        dspark_loss_mode: full_vocab
        dspark_sampled_ce_negatives: 0
        dspark_ce_token_chunk_size: 64
        dspark_markov_rank: 256
        dspark_markov_head_type: vanilla
        dspark_confidence_head_alpha: 0.0
        dspark_confidence_loss_alpha: 0.0
        dspark_confidence_head_with_markov: true
        # Draft-OPD-equivalent direct distillation defaults: sampled K3 on both
        # the response and rejected-draft streams with joint token normalization.
        dspark_ce_loss_alpha: 0.0
        # Independent CE on the correct replacement at the first rejection.
        # Adds alpha * global_mean_first_rejection_CE, without K3 clamps.
        # Requires trace-aligned anchors; zero preserves the existing objective.
        dspark_first_rejection_ce_alpha: 0.0
        dspark_first_rejection_ce_low_entropy_multiplier: 1.0
        dspark_first_rejection_ce_low_entropy_threshold: 0.01
        dspark_first_rejection_ce_max_rejected_logprob: -4.0
        dspark_l1_loss_alpha: 0.0
        dspark_trace_aligned_anchors: false
        dspark_accepted_k3_alpha: 1.0
        dspark_accepted_fkl_alpha: 0.0
        dspark_rejected_k3_alpha: 1.0
        # Optional separately normalized rejected-K3 auxiliary. A positive
        # value requires a positive prefix length measured from first rejection.
        dspark_rejected_aux_alpha: 0.0
        dspark_rejected_prefix_length: 0
        # Independent objective selectors. Existing *_k3_alpha coefficients
        # multiply the selected objective; stream weighting/decay are unchanged.
        # Response uses current-student support; rejected uses verified rollout
        # student support (candidate IDs are fixed during each training cycle).
        dspark_response_loss: k3
        dspark_rejected_loss: k3
        dspark_topk: 16
        # union combines student top-k and teacher top-k, deduplicated before
        # subset normalization. Rejected candidates come from rollout verify.
        dspark_topk_support: student
        dspark_response_stream_weight: 1.0
        dspark_rejected_stream_weight: 1.0
        dspark_rejected_position_decay: 0.9
        # Optional extra weights on the rejected branch, relative to its first
        # rejection. Keep absolute-position decay and joint token normalization.
        dspark_rejected_first_weight_multiplier: 1.0
        dspark_rejected_suffix_weight_multiplier: 1.0
        dspark_rejected_log_ratio_clamp: 20.0
        dspark_rejected_loss_max_clamp: 10.0
        # Optional robust K3 tail policy. Above the positive delta threshold,
        # continue with K3's tangent; keep the negative tail unchanged.
        dspark_asymmetric_k3_enabled: false
        # Null inherits the master switch above. Set accepted=false and
        # rejected=true to isolate asymmetric K3 to rejected draft tokens.
        dspark_accepted_asymmetric_k3_enabled: null
        dspark_rejected_asymmetric_k3_enabled: null
        dspark_asymmetric_k3_positive_threshold: 2.0
        # Optional per-microbatch inverse-frequency balancing. Base stream
        # weights remain the desired response:rejected token-mass ratio.
        dspark_dynamic_accept_reject_weighting_enabled: false
        dspark_dynamic_stream_weight_min_multiplier: 0.25
        dspark_dynamic_stream_weight_max_multiplier: 4.0
        # Mergeable weighted histogram used for global K3 median curves. Mean,
        # min, and max remain exact; median resolution is clamp / bins.
        dspark_k3_distribution_bins: 512
        # Optional per-token analysis dump for the sampled K3 token only. It
        # records target/draft logprobs, token IDs, K3, weights, and positions.
        dspark_dump_k3_logprobs: false
        dspark_dump_k3_logprobs_dir: null
        dspark_dump_k3_logprobs_interval_steps: 1
        # Zero keeps every K3 token. Set a positive per-stream cap to limit I/O.
        dspark_dump_k3_logprobs_max_tokens_per_stream: 0
        dspark_l1_chunk_size: 0
        dspark_debug_log: false
        dspark_debug_log_first_n: 2
        dspark_debug_log_interval: 100
        # P-EAGLE (parallel drafting: COD-subsampled multi-depth forward + KL loss).
        peagle_num_draft_layers: 4
        peagle_num_aux_hidden_states: 3
        peagle_draft_vocab_size: null
        peagle_num_depths: 8
        peagle_down_sample_ratio: 0.7
        peagle_down_sample_ratio_min: 0.2
        peagle_mask_token_id: null
        peagle_fc_norm: false
        # Domino (DFlash variant: causal GRU correction head + dual-logit curriculum).
        # Unset keys fall back to the matching dflash_* value.
        domino_block_size: 16
        domino_num_anchors: 512
        domino_loss_decay_gamma: 7.0
        domino_hidden_size: null
        domino_num_target_layers: 5
        domino_num_hidden_layers: 5
        domino_mask_token_id: null
        domino_target_layer_ids: null
        domino_max_window: 512
        domino_emb_dim: 256
        domino_gru_hidden_dim: 1024
        domino_pure_draft_prefix_len: 1
        domino_shift_label: true
        domino_lambda_base_start: 1.0
        domino_lambda_base_decay_steps: 2000
        # EAGLE-1 / EAGLE-2 draft training (single-step feature regression +
        # full-vocab soft-CE distillation against the frozen target head).
        eagle1_num_hidden_layers: 1
        eagle1_hidden_loss_weight: 1.0
        eagle1_token_loss_weight: 0.1
        eagle1_feature_noise: 0.0
        current_max_samples: 2048
        data_buffer_max_size: 1024
        hidden_state_clip_value: 1.0e4
        feature_store:
          type: torch_shard
          path: null
          max_samples_per_shard: 1024
          flush_interval_steps: 1
          shuffle: true
          repeat: true
          prefetch_depth: 2
          strict_schema: true
